[package]
name = "openperipheral"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight, account-free control for PC peripherals (battery, DPI, lighting)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["hid", "peripherals", "logitech", "razer", "dualsense"]
categories = ["hardware-support"]
publish = false

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "display", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
